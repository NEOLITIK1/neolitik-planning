      assert("Standard Nuit 21h50\u20136h via fen\xEAtre = 7h", Math.abs(nightWin("21:50", "06:00") - 7) < 1e-9, nightWin("21:50", "06:00"));
      assert("Standard Matin 5h50\u201314h via fen\xEAtre = 0h10", Math.abs(nightWin("05:50", "14:00") - 10 / 60) < 1e-9, nightWin("05:50", "14:00"));
      assert("Cr\xE9neau 20h\u20134h : 6h de nuit (22h\u21924h)", Math.abs(nightWin("20:00", "04:00") - 6) < 1e-9, nightWin("20:00", "04:00"));
    }
    return results2;
  }

  // tests/rules.js
  var fixture2 = (size = 8, chiefs = 3) => Array.from({ length: size }, (_, i) => ({ id: `p${i}`, short: `P${i}`, full: `Pr\xE9nom P${i}`, active: true, level: i < chiefs ? "N4" : "N1", isLeader: i < chiefs }));
  var where = (sc, name) => SHIFTS.find((k) => sc[k].includes(name));
  var errors2 = (sc) => (sc.issues || []).filter((i) => i.severity === "error");
  var same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
  function runRules() {
    const results2 = [];
    function check(name, run) {
      try {
        run();
        results2.push({ name, pass: true });
      } catch (e) {
        results2.push({ name, pass: false, detail: e.message });
      }
    }
    function expect(ok, message = "Condition non satisfaite") {
      if (!ok) throw new Error(message);
    }
    function mustThrow(fn) {
      let threw = false;
      try {
        fn();
      } catch {
        threw = true;
      }
      expect(threw, "Le conflit aurait d\xFB \xEAtre refus\xE9.");
    }
    check("Migration : anciens N4 chefs, r\xF4le explicite false conserv\xE9", () => {
      const ops = normalizeOperators([{ id: "a", level: "N4" }, { id: "b", level: "N4", isLeader: false }]);
      expect(isLeader(ops[0]) && !isLeader(ops[1]));
    });
    check("Un N2 chef et un N4 non chef sont trait\xE9s selon leur r\xF4le", () => {
      const ops = fixture2();
      ops[0].level = "N2";
      ops[3].level = "N4";
      const sc = buildSchedules(ops, 1, 12).schedules;
      expect(sc.every((s) => !errors2(s).length && SHIFTS.every((k) => s[k].filter((n) => isLeader(ops.find((o) => o.short === n))).length === 1)));
    });
    check("Lien sym\xE9trique, exclusif ; les anciens partenaires sont lib\xE9r\xE9s", () => {
      let ops = linkOperators(fixture2(), "p3", "p4");
      ops = linkOperators(ops, "p5", "p6");
      ops = linkOperators(ops, "p3", "p5");
      expect(ops[3].partnerId === "p5" && ops[5].partnerId === "p3" && !ops[4].partnerId && !ops[6].partnerId);
      ops = linkOperators(ops, "p3", null);
      expect(!ops[3].partnerId && !ops[5].partnerId);
    });
    check("Bin\xF4mes invalides refus\xE9s : deux chefs, soi-m\xEAme, mode volant diff\xE9rent", () => {
      const ops = fixture2();
      mustThrow(() => linkOperators(ops, "p0", "p1"));
      mustThrow(() => linkOperators(ops, "p3", "p3"));
      ops[4].isVolant = true;
      mustThrow(() => linkOperators(ops, "p3", "p4"));
    });
    check("Deux bin\xF4mes restent ensemble pendant 52 semaines, sans doublon", () => {
      let ops = linkOperators(fixture2(9), "p0", "p3");
      ops = linkOperators(ops, "p4", "p5");
      const sc = buildSchedules(ops, 1, 52).schedules;
      expect(sc.every((s) => where(s, "P0") === where(s, "P3") && where(s, "P4") === where(s, "P5") && !errors2(s).length));
      expect(sc.every((s) => new Set(SHIFTS.flatMap((k) => s[k])).size === 9));
    });
    check("Partenaire absent ou hors contrat : le membre disponible reste affect\xE9", () => {
      const ops = linkOperators(fixture2(), "p3", "p4");
      ops[4].fromWeek = 4;
      const sc = buildSchedules(ops, 1, 6, { 5: ["P4"] }).schedules;
      expect(sc.every((s) => !!where(s, "P3")));
      expect(!where(sc[0], "P4") && !where(sc[4], "P4"));
    });
    check("Nuit \xE0 quatre autoris\xE9e lorsqu\u2019un groupe indivisible impose quatre", () => {
      const ops = fixture2(7);
      ops[0].partnerId = "p3";
      ops[3].partnerId = "p0";
      ops[4].partnerId = "p5";
      ops[5].partnerId = "p4";
      ops[6].partnerId = "p5";
      const s = buildSchedules(ops, 1, 1).schedules[0];
      expect(s.nuit.length >= 3 && !errors2(s).length);
      expect(s.nuit.length === 4, JSON.stringify(s));
    });
    check("Six personnes : trois chaque nuit et d\xE9rogation explicit\xE9e", () => {
      const sc = buildSchedules(fixture2(6), 1, 12).schedules;
      expect(sc.every((s) => s.nuit.length === 3 && !errors2(s).length));
      expect(sc.slice(1).every((s) => s.issues.some((i) => i.code === "repeat-night")));
    });
    check("Trois chefs, deux \xE9quipiers : aucun faux planning conforme", () => {
      const sc = buildSchedules(fixture2(5), 1, 5).schedules;
      expect(sc.every((s) => s.nuit.length === 3 && !errors2(s).length));
      const impossible = buildSchedules(fixture2(4), 1, 1).schedules[0];
      expect(errors2(impossible).length > 0);
    });
    check("Chef manquant : impossibilit\xE9 signal\xE9e, aucun doublage d\u2019un chef", () => {
      const ops = fixture2();
      const sc = buildSchedules(ops, 1, 2, { 1: ["P0"] }).schedules[0];
      expect(sc.issues.some((i) => i.code === "infeasible"));
      expect(SHIFTS.every((k) => sc[k].filter((n) => isLeader(ops.find((o) => o.short === n))).length <= 1));
    });
    check("Quatri\xE8me chef : r\xE9serve explicite et rotation \xE9quitable", () => {
      const ops = fixture2(9, 4), r = buildSchedules(ops, 1, 52);
      expect(r.schedules.every((s) => s.reserve.length === 1 && !errors2(s).length));
      const totals = ops.slice(0, 4).map((o) => r.nightCount[o.short] + r.matCount[o.short] + r.amCount[o.short]);
      expect(Math.max(...totals) - Math.min(...totals) <= 2, JSON.stringify(totals));
    });
    check("Absence partielle : la nuit conserve trois pr\xE9sents chaque jour", () => {
      const ops = fixture2(9), abs = { 1: ["P3|1|Lun", "P4|1|Mar", "P5|1|Mer"] };
      const s = buildSchedules(ops, 1, 1, abs).schedules[0];
      expect(!errors2(s).length);
      expect([1, 2, 3, 4, 5].every((day) => s.nuit.filter((n) => !absentOnDay(n, 1, day, abs)).length >= 3));
    });
    check("Chef absent un jour : publication invalid\xE9e par une erreur quotidienne", () => {
      const s = buildSchedules(fixture2(), 1, 1, { 1: ["P0|1|Mer"] }).schedules[0];
      expect(s.issues.some((i) => i.code === "daily-leader"));
    });
    check("Chef rempla\xE7ant automatique disponible : couvre le cong\xE9 partiel", () => {
      const s = buildSchedules(fixture2(9, 4), 1, 1, { 1: ["P0|1|Mer"] }).schedules[0];
      expect(!errors2(s).length && !where(s, "P0"));
    });
    check("Jour ferm\xE9 : l\u2019absence du chef ce jour-l\xE0 ne cr\xE9e pas de faux conflit", () => {
      const s = buildSchedules(fixture2(), 1, 1, { 1: ["P0|1|Mer"] }, {}, {}, {}, { year: 2026, joursChomes: { "1-31/12": true } }).schedules[0];
      expect(!errors2(s).length);
    });
    check("Samedi nuit travaill\xE9 : l\u2019absence partielle y est contr\xF4l\xE9e", () => {
      const ops = fixture2(), slots = { matin: ["P0", "P3", "P4"], am: ["P1", "P5"], nuit: ["P2", "P6", "P7"] };
      const issues = validateSchedule(slots, ops, 1, { 1: ["P6|1|Sam"] }, {}, {}, { satWeeks: [1], satEndPostes: { 1: "N" } });
      expect(issues.some((i) => i.code === "daily-night"));
      expect(!validateSchedule(slots, ops, 1, { 1: ["P6|1|Sam"] }, {}, {}, { satWeeks: [1], satEndPostes: { 1: "AM" } }).some((i) => i.code === "daily-night"));
    });
    check("Ajustement : absents complets et doublons nettoy\xE9s, archives intactes", () => {
      const ops = fixture2();
      ops[7].isVolant = true;
      const slots = { matin: ["P0", "P3", "P7"], am: ["P1", "P3", "P4"], nuit: ["P2", "P5", "P6"] };
      const r = buildSchedules(ops, 1, 2, { 2: ["P7"] }, {}, { 2: slots }, { 1: slots });
      expect(same(r.schedules[0].matin, slots.matin));
      expect(!where(r.schedules[1], "P7"));
      const all = SHIFTS.flatMap((k) => r.schedules[1][k]);
      expect(new Set(all).size === all.length);
    });
    check("Ajustement non conforme : bin\xF4me s\xE9par\xE9 et deux chefs d\xE9tect\xE9s", () => {
      const ops = linkOperators(fixture2(), "p3", "p4");
      const issues = validateSchedule({ matin: ["P0", "P1", "P3"], am: ["P4", "P5"], nuit: ["P2", "P6", "P7"] }, ops, 1);
      expect(issues.some((i) => i.code === "pair-split") && issues.some((i) => i.code === "leader-count"));
    });
    check("Glissement et \xE9change : bin\xF4me entier d\xE9plac\xE9 sans doublon", () => {
      const ops = linkOperators(fixture2(), "p3", "p4"), slots = { matin: ["P0", "P3", "P4"], am: ["P1", "P5"], nuit: ["P2", "P6", "P7"] };
      const moved = moveAssignment(slots, ops, 1, {}, {}, "P3", "am");
      expect(where(moved, "P3") === "am" && where(moved, "P4") === "am");
      const swapped = moveAssignment(slots, ops, 1, {}, {}, "P3", "am", "P5");
      expect(where(swapped, "P5") === "matin" && where(swapped, "P4") === "am");
      expect(new Set(SHIFTS.flatMap((k) => swapped[k])).size === 8);
    });
    check("Chef : d\xE9placement sur un second chef refus\xE9, \xE9change accept\xE9", () => {
      const ops = fixture2(), slots = { matin: ["P0", "P3", "P4"], am: ["P1", "P5"], nuit: ["P2", "P6", "P7"] };
      mustThrow(() => moveAssignment(slots, ops, 1, {}, {}, "P0", "am"));
      expect(where(moveAssignment(slots, ops, 1, {}, {}, "P0", "am", "P1"), "P1") === "matin");
    });
    check("Volant chef : remplacement d\u2019un chef, sans doublon ni indisponible", () => {
      const ops = fixture2(9);
      ops[8].isLeader = true;
      ops[8].isVolant = true;
      const slots = { matin: ["P0", "P3", "P4"], am: ["P1", "P5"], nuit: ["P2", "P6", "P7"] };
      const moved = moveAssignment(slots, ops, 1, {}, {}, "P8", "am", "P1");
      expect(where(moved, "P8") === "am" && !where(moved, "P1"));
      mustThrow(() => moveAssignment(slots, ops, 1, { 1: ["P8"] }, {}, "P8", "am", "P1"));
    });
    check("D\xE9part et changements de r\xF4le ne r\xE9\xE9crivent pas les archives", () => {
      const ops = fixture2(), old = buildSchedules(ops, 1, 4).schedules, archive = Object.fromEntries(old.map((s) => [s.s, s]));
      const before = JSON.stringify(archive);
      ops[0].active = false;
      ops[1].level = "N1";
      ops[1].isLeader = false;
      const sc = buildSchedules(ops, 1, 4, { 1: ["P3"] }, {}, { 1: { matin: [], am: [], nuit: [] } }, archive).schedules;
      expect(sc.every((s, i) => SHIFTS.every((k) => same(s[k], old[i][k]))));
      expect(JSON.stringify(archive) === before);
    });
    check("\xC9quit\xE9 : absence compl\xE8te exclue des semaines disponibles", () => {
      const r = buildSchedules(fixture2(), 1, 4, { 2: ["P3"] }, { 3: ["P3"] });
      expect(r.presentCount.P3 === 2 && r.presentCount.P4 === 4);
    });
    check("La longueur et le d\xE9but de la fen\xEAtre ne changent pas les rotations", () => {
      const ops = fixture2(), abs = { 6: ["P3", "P4"] };
      const a = buildSchedules(ops, 1, 5, abs).schedules, b = buildSchedules(ops, 1, 12, abs).schedules;
      expect(same(a, b.slice(0, 5)));
      expect(same(buildSchedules(ops, 4, 5, abs).schedules, b.slice(3, 8)));
    });
    check("Une recherche interrompue ne pr\xE9tend jamais avoir trouv\xE9 un r\xE9sultat garanti", () => {
      const s = buildSchedules(fixture2(), 1, 1, {}, {}, {}, {}, { searchLimit: 2 }).schedules[0];
      expect(s.issues.some((i) => i.code === "search-limit"));
    });
    check("Oracle exhaustif : nuit cons\xE9cutive uniquement si indispensable (16 cas)", () => {
      for (let scenario = 0; scenario < 16; scenario++) {
        const ops = fixture2(6 + scenario % 3), previous = { matin: ["P0"], am: ["P1"], nuit: scenario % 2 ? ["P2", "P3", "P4"] : ["P0", "P4", "P5"] };
        if (scenario % 4 === 0) {
          ops[3].partnerId = "p4";
          ops[4].partnerId = "p3";
        }
        let optimum = Infinity;
        const choices = Array(ops.length).fill(0);
        const visit = (i) => {
          if (i === ops.length) {
            if ([0, 1, 2].some((k) => ops.filter((o, j) => o.isLeader && choices[j] === k).length !== 1)) return;
            if (choices.filter((k) => k === 2).length < 3) return;
            if (ops[3].partnerId && choices[3] !== choices[4]) return;
            optimum = Math.min(optimum, ops.filter((o, j) => choices[j] === 2 && previous.nuit.includes(o.short)).length);
            return;
          }
          for (let k = 0; k < 3; k++) {
            choices[i] = k;
            visit(i + 1);
          }
        };
        visit(0);
        const s = buildSchedules(ops, 2, 1, {}, {}, {}, { 1: previous }).schedules[0];
        const repeated = s.nuit.filter((n) => previous.nuit.includes(n)).length;
        expect(repeated === optimum, `Sc\xE9nario ${scenario}: ${repeated} au lieu de ${optimum}`);
      }
    });
    return results2;
  }

  // tests/payroll.js
  function runPayroll() {
    const results2 = [];
    const op = { id: "old", short: "OLD", full: "Ancien op\xE9rateur", active: false, level: "N1" };
    const setup = (year, week) => ({ operators: [op], archive: { [year]: { [week]: { matin: [], am: [], nuit: ["OLD"] } } } });
    const check = (name, ok) => results2.push({ name, pass: !!ok, detail: ok ? "" : "Calcul mensuel incorrect" });
    let data = setup(2026, 1), rows = computeMonthHours(2026, 0, data);
    check("Paie r\xE9elle : op\xE9rateur inactif conserv\xE9 dans l\u2019archive, janvier S1 = 14 heures", rows[0]?.total === 14 && rows[0]?.night === 14);
    rows = computeMonthHours(2026, 0, { ...data, absences: { 1: ["OLD"] } });
    check("Paie r\xE9elle : absence compl\xE8te neutralise une affectation archiv\xE9e", rows.length === 0);
    rows = computeMonthHours(2026, 0, { ...data, leaves: { 1: ["OLD"] } });
    check("Paie r\xE9elle : cong\xE9 complet neutralise une affectation archiv\xE9e", rows.length === 0);
    rows = computeMonthHours(2026, 0, { ...data, absences: { 1: ["OLD|1|Jeu"] } });
    check("Paie r\xE9elle : absence ponctuelle = 7 heures d\xE9duites", rows[0]?.total === 7);
    rows = computeMonthHours(2026, 0, { ...data, leaves: { 1: ["OLD:4-5"] } });
    check("Paie r\xE9elle : cong\xE9 partiel = jours concern\xE9s d\xE9duits", rows.length === 0);
    rows = computeMonthHours(2026, 0, { ...data, joursAmenages: { "1-02/01": { nuit: { s: "14:00", e: "22:00" } } } });
    check("Paie r\xE9elle : horaires am\xE9nag\xE9s conservent le pay\xE9 et modifient la nuit", rows[0]?.total === 14 && rows[0]?.night === 7);
    data = { ...setup(2026, 18), satWeeks: [18], satEndPostes: { 18: "N" } };
    const april = computeMonthHours(2026, 3, data)[0], may = computeMonthHours(2026, 4, data)[0];
    check("Paie r\xE9elle : heures suppl\xE9mentaires au prorata entre avril et mai", Math.abs(april?.sup - 14 / 3) < 1e-8 && Math.abs(may?.sup - 7 / 3) < 1e-8 && april?.total === 28 && may?.total === 14);
    rows = computeMonthHours(2026, 4, { ...data, satEndPostes: { 18: "AM" } });
    check("Paie r\xE9elle : samedi nuit non travaill\xE9 exclu du total", rows[0]?.total === 7 && rows[0]?.sup === 0);
    rows = computeMonthHours(2026, 4, { ...data, joursChomes: { "18-01/05": true } });
    check("Paie r\xE9elle : jour ch\xF4m\xE9 exclu, semaine ramen\xE9e \xE0 35 heures", rows[0]?.total === 7 && rows[0]?.sup === 0);
    return results2;
  }

  // tests/browser-entry.js
  var results = [...runRegression(), ...runRules(), ...runPayroll(), ...runAnnualDaily()];
  var container = document.getElementById("results");
  for (const result of results) {
    const row = document.createElement("div");
    row.className = `test ${result.pass ? "pass" : "fail"}`;
    row.textContent = `${result.pass ? "\u2705" : "\u274C"} ${result.name}${result.pass ? "" : ` \u2014 ${result.detail}`}`;
    container.append(row);
  }
  document.getElementById("summary").textContent = `${results.filter((r) => r.pass).length}/${results.length} contr\xF4les r\xE9ussis`;
  window.testResults = results;
})();
